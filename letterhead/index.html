<head>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->

    <style>
        @page {
            size: A4;
            margin: 25mm 15mm 15mm 15mm;
            /* top, right, bottom, left */
        }

        @page :first {
            margin-top: 0mm;
            /* remove top margin for first page */
        }

        @media print {

            body,
            html {
                margin: 0;
                padding: 0;
                height: 100%;
            }

            .no-print {
                display: none;
            }

            .footer {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                height: 50px;
                background: linear-gradient(0deg, #ff9900 50%, #ffb84d 100%);
                color: #fff;
                text-align: center;
                line-height: 50px;
                font-size: 11pt;
            }




        }

        body,
        html {
            margin: 0;
            padding: 0;
            font-family: 'Times New Roman', Times, serif;
            background: #fff;
            color: #000;
            height: 100%;
        }

        .page {
            width: 210mm;
            min-height: 297mm;
            margin: 0 auto;
            background: white;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            position: relative;
            page-break-after: auto;
        }

        /* HEADER */
        .header {
            height: 220px;
            background: linear-gradient(180deg, #000 70%, #1a1a1a 100%);
            color: white;
            padding: 20px 40px;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('map.png') center/cover no-repeat;
            opacity: 0.13
        }

        .me-2 {
            margin-right: 1.0rem !important;
        }

        .fs-5 {
            font-size: 1.5rem !important;
        }

        .topright {
            position: absolute;
            top: 205px;
            /* same as header height */
            right: 30px;
            z-index: 10;
        }

        .bottomleft {
            position: absolute;
            bottom: 60px;
            /* same as footer height */
            left: 30px;
            z-index: 10;
            transform: translate(20px, 0) rotate(180deg) scale(1.2);


        }


        .logo-container {
            position: relative;
            z-index: 2;
        }

        .logo-svg {
            height: 60px;
            margin-right: 15px;
        }

        .company-name {
            line-height: 1.1;
        }

        .company-name .main {
            font-size: 28px;
            letter-spacing: 1px;
        }

        .company-name .creative {
            color: white;
        }

        .company-name .it {
            color: #ff9900;
            font-style: italic;
        }

        .company-name .park {
            color: white;
        }

        .company-name small {
            font-size: 13px;
            color: #ccc;
            font-weight: normal;
        }

        .contact-info {
            font-size: 14px;
            line-height: 1.7;
            padding-left: 38px;

        }

        .contact-info .icon {
            width: 14px;
            height: 14px;
            fill: #ff9900;
            margin-right: 6px;
        }

        .contact-info a {
            color: white;
            text-decoration: none;
        }

        /* CONTENT */
        #content {
            flex: 1;
            padding: 50px 60px;
            font-size: 12pt;
            line-height: 1.8;
        }

        #content p {
            margin-bottom: 16px;
        }

        .signature-block {
            margin-top: 50px;
        }

        .signature-line {
            width: 220px;
            border-top: 1px solid #000;
            position: relative;
            margin: 40px 0 10px;
        }

        /* .stamp {
                position: absolute;
                left: 70px;
                top: -30px;
                width: 90px;
                height: 90px;
                background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="%23000" stroke-width="2"/><circle cx="50" cy="50" r="35" fill="none" stroke="%23000" stroke-width="1"/><text x="50" y="45" font-size="9" font-family="Arial" text-anchor="middle" fill="%23000">CREATIVE</text><text x="50" y="58" font-size="9" font-family="Arial" text-anchor="middle" fill="%23000">IT PARK</text></svg>') center/contain no-repeat;
                opacity: 0.7;
            } */

        .name-title {
            font-weight: bold;
            margin-bottom: 2px;
        }

        .designation {
            font-size: 11pt;
            color: #333;
        }

        /* FOOTER */
        .footer {
            height: 60px;
            background: linear-gradient(0deg, #ff9900 50%, #ffb84d 100%);
            position: relative;
            overflow: hidden;
        }

        .footer::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 20px;

        }
    </style>
